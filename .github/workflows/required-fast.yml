name: required-fast
on:
  pull_request:
    branches:
      - main
jobs:
  required-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: required-fast
        run: sh scripts/required_fast.sh
