name: required-fast
on:
  pull_request:
    branches:
      - main
jobs:
  required-fast:
    # skipped on the private hub (spends no minutes, GitHub Free 2,000/month quota), runs free on the public export
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.251
      - name: required-fast
        run: sh scripts/required_fast.sh
