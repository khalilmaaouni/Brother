name: required-fast
# NO-SELF-FIRING-CI LAW (founder order 2026-08-16, reaffirmed 2026-09-13):
# this workflow must never fire by itself. on: pull_request is forbidden.
# The real pre-merge gate is local: sh scripts/required_fast.sh. This file
# stays dispatch-only, ubuntu-only, and is run by hand when wanted. The main
# ruleset no longer requires this check, so dropping the PR trigger cannot
# block merges.
on:
  workflow_dispatch
jobs:
  required-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.251
      - name: required-fast
        run: sh scripts/required_fast.sh
