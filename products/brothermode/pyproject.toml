    # the two hook entry points that used to be POSIX shell and are now
    # Python, so for the first time they are modules a packaged install can
    # even carry.
    "bm_bbstatus",
    "bm_sessionstart",
    "bm_hookchain",
    "bm_cursor",
    "bm_cursor_hook",
    # ADDED 2026-08-29. Eight tools shipped in tools/ that a pipx or pip
    # install would NOT have delivered, found by measuring the two sets
