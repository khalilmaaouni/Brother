# BrotherMode packaging metadata (PEP 621).
#
# What this buys: `pipx install brothermode`, `uv tool install brothermode`,
# or `pip install brothermode` puts the tool commands on PATH without the
# founder cloning a repository or knowing where the Python files live.
#
# Three deliberate choices, each of which someone will want to change later,
# so the reason is recorded here rather than in a commit message.
#
# 1. No dependencies. Not "few": none. Every shipping tool is standard
#    library only, which is an invariant of this project rather than an
#    accident, so the dependency list stays empty and any future addition is
#    a decision the founder makes on purpose.
#
# 2. Flat top-level modules, not a package. The tools load each other by
#    absolute path off their own directory (importlib against
#    os.path.dirname(__file__)) rather than by import name, precisely so a
#    hostile sys.path cannot shadow bm_store. Wrapping them in a package
#    would mean rewriting that loader in every file. Instead the modules
#    install side by side exactly as they sit in tools/, and the loader
#    keeps working unchanged. The cost is real and named in
#    docs/PACKAGING.md: 13 bm_* names land at the top level of the
#    environment's site-packages. The figure was already stale at nine
#    when the documentation engine landed on 2026-07-30; it is the length
#    of the py-modules list below, which is the only thing that decides
#    it.
#
# 3. Console scripts cover the CLIs, not the hooks. bm_autosave and
#    bm_fence_hook ship as modules so a packaged install has them, but they
#    get no console script: Claude Code hooks are wired by explicit command
#    path in settings.json, and a name on PATH is not what that wiring
#    wants.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "brothermode"
version = "3.4.4"
description = "A Claude Code skill and toolchain that makes an AI coding session behave like a colleague: durable memory, single-writer fences, honest reporting."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Khalil Maaouni" }]
keywords = ["claude", "claude-code", "agent", "skill", "memory", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/khalilmaaouni/BrotherModeUp"
Source = "https://github.com/khalilmaaouni/BrotherModeUp"
Changelog = "https://github.com/khalilmaaouni/BrotherModeUp/blob/main/CHANGELOG.md"

[project.scripts]
brothermode = "brothermode_cli:cli"
bm-store = "bm_store:main"
bm-threads = "bm_threads:main"
bm-telemetry = "bm_telemetry:main"
bm-learn = "bm_learn:cli"
bm-packs = "bm_packs:cli"
bm-docs = "bm_docs:cli"
bm-docs-export = "bm_docs_export:cli"
bm-runtimes = "bm_runtimes:cli"
bm-score = "bm_score:cli"
bm-project = "bm_project:cli"
bm-ledger = "bm_ledger:main"
bm-sentinel = "bm_sentinel:main"
bm-autonomy = "bm_autonomy:cli"
bm-controller = "bm_controller:cli"
bm-lead = "bm_lead:cli"
bm-view = "bm_view:cli"
bm-statusline = "bm_statusline:main"
bm-cursor = "bm_cursor:cli"

[tool.setuptools]
# "" (the root) maps to tools/, where every flat py-module below lives.
# brotherme is a real package (brotherme/, brotherme/core/) that sits next
# to tools/ at the repo root, not inside it, so it needs its own mapping;
# without this second entry setuptools looks for it at tools/brotherme and
# finds nothing (reproduced: built wheel lists brotherme/ zero times
# without this line, three times with it).
package-dir = { "" = "tools", "brotherme" = "brotherme" }
# Explicit list, never a wildcard. A wildcard would sweep in test_*.py and
# would also silently ship whatever new file lands in tools/ next. Adding a
# module here is a decision, and the packaging test in tools/test_bm.py
# fails if this list and the shipping tools in tools/ disagree.
py-modules = [
    # C3: the path helper the hooks and the vault tools import for the config
    # directory and the plugin root. A copy of scripts/brother_paths.py, kept
    # byte-identical by scripts/test_brother_paths.py.
    "brother_paths",
    "bm_bench",
    "bm_passport",
    "bm_passport_validator",
    "brothermode_cli",
    "bm_continue",
    "bm_store",
    "bm_reconcile",
    "bm_reconcile_worktrees",
    "bm_release_invariant",
    "bm_repo_scope",
    "bm_learning",
    "bm_learn",
    "bm_packs",
    "bm_docs",
    "bm_docs_export",
    "bm_score",
    "bm_telemetry",
    "bm_threads",
    "bm_runtimes",
    "bm_autosave",
    "bm_fence_hook",
    "bm_bash_audit",
    "bm_project_facts",
    "bm_project",
    "bm_ledger",
    "bm_handover",
    "bm_sentinel",
    "bm_session_cap",
    "bm_autonomy",
    "bm_controller",
    "bm_lead",
    "bm_visual",
    "bm_view",
    "bm_hookbench",
    "bm_statusline",
    "bm_lint_walltime",
    "bm_progress_check",
    "bm_effects",
    "bm_export_seam",
    "bm_escalate",
    "bm_stall",
    "bm_messages",
    "bm_forecast",
    "bm_idle",
    "bm_toolkit",
    # 2026-08-28, the vault memory tooling. All eight arrived because the
    # packaging gate REFUSED them, which is the reason that list is checked
    # rather than trusted: every one of these is a plain module in tools/, so
    # a pipx or pip install that does not name them here simply does not have
    # them. vault_recall_hook ships as a module and gets no console script,
    # for the same reason bm_autosave and bm_fence_hook do not: a Claude Code
    # hook is wired by explicit command path in settings.json, and a name on
    # PATH is not what that wiring wants.
    "bm_vault",
    "bm_vault_catalog",
    "bm_vault_graph",
    "bm_private_scan",
    "bm_memory_budget",
    "bm_gate",
    "bm_embed_bge",
    "vault_recall_hook",
    # 2026-08-29, the vault writer lock. Arrived on the branch without a
    # declaration, which the packaging gate refused: a module in tools/ that
    # pyproject does not name is simply absent from a pipx or pip install, and
    # both bm_vault_catalog and the pre-commit hook resolve this one at runtime.
    "bm_vault_lock",
    # 2026-08-29, the memory ceremony. Same gap as bm_vault_lock right above,
    # caught the same way: the packaging gate refuses a module in tools/ that
    # pyproject does not name, because that is exactly what a pipx or pip
    # install would silently omit.
    "bm_vault_distill",
    # 2026-08-29, WBS 16 and WBS 9: the typed-edge traversal lives inside the existing
    # bm_vault_graph module (no new file), but bm_vault_promote is a new one and needs
    # its own declaration for the same reason the two entries right above do.
    "bm_vault_promote",
    # 2026-08-29, benchmark row D05: stable note identity. Declared in the
    # same change that lands it, because every entry above this one arrived
    # only after the packaging gate refused it.
    "bm_vault_ids",
    # 2026-08-29, D09: the bi-temporal contract, reading half.
    "bm_vault_temporal",
    # 2026-08-29, D08: the authority contract and comparator.
    "bm_vault_authority",
    # 2026-08-30, D07: claim-level provenance, the tooling half.
    "bm_vault_provenance",
    # 2026-08-29, D12: the lifecycle state machine (candidate to canonical).
    "bm_vault_lifecycle",
    # 2026-08-30, D12 part B: the write side, recording a promotion the
    # contract above already decided is legal. Named promotionS, not
    # promote, because bm_vault_promote already means the WBS 9 nudge
    # counter and this module must not collide with it.
    "bm_vault_promotions",
    # 2026-08-30, VB10-04: the LLM enrichment lane, a machine-drafted candidate
    # filed through the same intake gate and the same promotion field as
    # every other note. Declared in the same change that lands it.
    "bm_vault_enrich",
    # 2026-08-30, D14: the entity layer, an ontology of things rather than a
    # taxonomy of pages. Declared in the same change that lands it.
    "bm_vault_entity",
    # 2026-08-30, D06: the crosswalk, many source-IDs denoting one entity.
    # Declared in the same change that lands it.
    "bm_vault_crosswalk",
    # 2026-08-30, D13: retention and deletion propagation (census and
    # targeted propagate over the retrieval index's derived tables).
    "bm_vault_retention",
    # 2026-09-04, E57 mechanism 2: time decay and reinforcement, the
    # usefulness half of the same sort. An old note nobody has confirmed fades
    # in RANK on an Ebbinghaus curve (borrowed from MemoryBank,
    # https://arxiv.org/abs/2305.10250) while a confirmed one strengthens.
    # Ranking only, floored so it reorders and never removes, and it writes to
    # a sidecar store rather than to any note.
    "bm_vault_decay",
    # 2026-08-30, VB2-06: staleness and consolidation, the reading half.
    # A note's verified_at (bm_vault_temporal's field) ages past its class
    # horizon and demotes its own authority rank in bm_vault's recall sort.
    "bm_vault_staleness",
    # 2026-08-30, VB2-01: permission-aware retrieval. The access policy
    # contract: recall trims by querying identity before content is served,
    # and a withheld note is counted, never named.
    "bm_vault_policy",
    # 2026-08-30, D09 part B: the as-of query, a fact asked what it was at a
    # past instant. Missed at its own merge (the packaging gate caught it on
    # two independent branches); declared here rather than left as the red
    # every tree inherits.
    "bm_vault_asof",
    # 2026-08-30, VB2-05: the answer ledger, what a recall actually read.
    # Same miss, same gate, same fix.
    "bm_vault_ledger",
    # 2026-08-30, VB6-08: the interchange replay contract (payload-free
    # events, idempotency, out-of-order tolerance, corrections, tombstones).
    # Declared in the same change that lands it, same packaging-gate lesson
    # as every entry above.
    "bm_vault_events",
    # 2026-08-30, VB4-04: the frontmatter schema linter. Required fields per
    # type, id format, ISO dates, the authority/lifecycle vocabularies and
    # duplicate-field detection, closing the gap bm_vault_graph's status/type
    # enum check leaves open. Declared in the same change that lands it, per
    # the same packaging-gate lesson as every entry above.
    "bm_vault_lint",
    # 2026-08-30, VB2-02: the vault answers over the wire. A localhost-first
    # HTTP front on the real recall subprocess; declared in the same change
    # that lands it, same packaging-gate lesson as every entry above.
    "bm_vault_serve",
    # 2026-08-31, VB3-03: RequestContext and tenancy for the served vault --
    # the immutable per-request id and the tenant-to-subprocess-env seam
    # bm_vault_serve.py composes with. Declared in the same change that
    # lands it, same packaging-gate lesson as every entry above.
    "bm_vault_context",
    # 2026-08-30, VB4-02: the typed-edge curation queue and its three
    # finders (duplicate titles, Jaccard link prediction, co-citation).
    # Declared in the same change that lands it, same lesson as above.
    "bm_vault_curate",
    # 2026-08-29, the W9 controller train plus the freshness half of WBS 17.
    # All four arrived the same way every entry above this one did: the
    # packaging gate REFUSED them, because a module in tools/ that pyproject
    # does not name is simply absent from a pipx or pip install. bm_freshness
    # is the one that matters most here, because the point-of-need memory hook
    # resolves it at runtime through bm_vault, so an install missing it has a
    # memory path that cannot classify anything.
    "bm_freshness",
    "bm_plan",
    "bm_recurrence",
    "bm_verify",
    "bm_repair",
    "bm_summary",
    "bm_worker_spawn",
    # 2026-08-20, A5: the smallest verified-reality record. No console
    # script, matching bm_passport (its own closest structural sibling,
