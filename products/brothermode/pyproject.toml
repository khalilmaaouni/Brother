    # Three of them are the worker, the verifier and the repair loop.
    "bm_freshness",
    "bm_plan",
    "bm_queue_numbers",
    "bm_recurrence",
    "bm_repair",
    "bm_summary",
    "bm_verify",
    "bm_worker_spawn",
    # 2026-08-30, the MCP connector catalog. Declared in the same change
