<section id="help" class="bm-section"><h2>About this page<[PATH WITHHELD]><p class="bm-what">What this page is, and what it cannot do.<[PATH WITHHELD]><p>This page is written from your project's records. Every line on it comes from a record, and the short code in the header changes whenever your records change, so an old tab is visibly older than a fresh one.<[PATH WITHHELD]><ul><li><a href="#header">Where this stands<[PATH WITHHELD]>: The outcome, where the work is, the setup count, and the newest record this page was built from.<[PATH WITHHELD]><li><a href="#needs-you">Waiting on you<[PATH WITHHELD]>: At most one thing interrupts you at a time; anything else waits its turn here.<[PATH WITHHELD]><li><a href="#next-step">Your next step<[PATH WITHHELD]>: Always exactly one recommended step; a page with two recommendations is a page with none.<[PATH WITHHELD]><li><a href="#pipeline">The path of the work<[PATH WITHHELD]>: The stages of the work drawn left to right, with the current one marked NOW.<[PATH WITHHELD]><li><a href="#programme">Where the programme stands<[PATH WITHHELD]>: One bar per piece of work, grouped into the phase its own record names, with a box that ticks only on a finished piece that has a check on file.<[PATH WITHHELD]><li><a href="#progress">How far each lane has moved<[PATH WITHHELD]>: One bar per piece of work inside its own lane, plus what is finished and what is blocked and on what.<[PATH WITHHELD]><li><a href="#counts">How much, against what limit<[PATH WITHHELD]>: Checks passed, work budget used and findings, each as a number against its agreed limit.<[PATH WITHHELD]><li><a href="#risks">What could still go wrong<[PATH WITHHELD]>: Each open risk with what would settle it and who is watching it, the most pressing first.<[PATH WITHHELD]><li><a href="#decisions">Decisions waiting for your answer<[PATH WITHHELD]>: Each open choice with a recommendation, what else was weighed, and the option to take it back.<[PATH WITHHELD]><li><a href="#insights">What I now believe, and what proved it<[PATH WITHHELD]>: Each thing learned, with its proof, what was rejected, what would change it, and your standing option.<[PATH WITHHELD]><li><a href="#gates">What has to be true before this ships<[PATH WITHHELD]>: The checks that have to pass before the work ships, drawn as a ladder.<[PATH WITHHELD]><li><a href="#lanes">Who holds the pen<[PATH WITHHELD]>: Drawn only when the work is split between more than one owner.<[PATH WITHHELD]><li><a href="#documents">What each finished piece produced<[PATH WITHHELD]>: Every finished piece of work with the paths it produced and the checks that ran on it, timed.<[PATH WITHHELD]><li><a href="#timeline">The story so far<[PATH WITHHELD]>: Every catch-up in order, so the run replays forwards from the beginning.<[PATH WITHHELD]><li><a href="#your-move">Your move<[PATH WITHHELD]>: The exact text to paste into the chat to take the work and any open decision back into your hands.<[PATH WITHHELD]><li><a href="#help">About this page<[PATH WITHHELD]>: The one place the page explains itself; each section above carries one line and the rest lives here.<[PATH WITHHELD]><[PATH WITHHELD]><p>What this page cannot do:<[PATH WITHHELD]><ul><li>It is a picture of your records at the moment it was written, not a live screen. It updates when it is written again, which happens on command and when a working session stops.<[PATH WITHHELD]><li>Opening it reads and changes nothing in your project.<[PATH WITHHELD]><li>Buttons on a web page cannot act on your project. The one way back in is copying the text under Your move into the chat.<[PATH WITHHELD]><li>It cannot show your application running, because BrotherMode does not run your application.<[PATH WITHHELD]><[PATH WITHHELD]><[PATH WITHHELD]>
